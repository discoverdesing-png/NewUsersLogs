<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Sistema Jaguar</title>
    <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { 
        font-family: 'Segoe UI', Arial, sans-serif; 
        background: #0a1628; 
        min-height: 100vh;
        padding: 20px;
        color: #e0e0e0;
    }
   .navbar {
        background: #0f1f38;
        padding: 20px 40px;
        border-radius: 12px;
        border: 1px solid #1a2f4a;
        box-shadow: 0 0 40px rgba(0, 123, 255, 0.3);
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 30px;
    }
   .navbar h1 {
        color: #007bff;
        font-size: 24px;
        text-shadow: 0 0 20px rgba(0, 123, 255, 0.8);
        letter-spacing: 2px;
        font-weight: 800;
    }
   .navbar-left {
        display: flex;
        align-items: center;
        gap: 20px;
    }
   .user-info {
        display: flex;
        align-items: center;
        gap: 15px;
    }
   .user-pic {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        border: 2px solid #007bff;
        object-fit: cover;
        box-shadow: 0 0 15px rgba(0, 123, 255, 0.6);
    }
   .user-name {
        color: #fff;
        font-size: 15px;
        font-weight: 700;
    }
   .badge {
        background: #007bff;
        color: #fff;
        padding: 4px 10px;
        border-radius: 5px;
        font-size: 10px;
        font-weight: 800;
    }
   .btn { 
        padding: 12px 25px; 
        border-radius: 6px; 
        font-weight: 700; 
        font-size: 13px;
        cursor: pointer;
        transition: all 0.3s;
        text-transform: uppercase;
        background: #0a1628;
        color: #fff;
        border: 2px solid #007bff;
    }
   .btn:hover {
        background: #007bff;
        box-shadow: 0 0 20px rgba(0, 123, 255, 0.8);
        transform: translateY(-2px);
    }
   .btn-danger {
        border-color: #dc3545;
        color: #dc3545;
    }
   .btn-danger:hover {
        background: #dc3545;
        color: #fff;
    }
   .card { 
        background: #0f1f38; 
        padding: 25px; 
        border-radius: 12px; 
        box-shadow: 0 0 60px rgba(0, 123, 255, 0.2);
        border: 1px solid #1a2f4a;
    }
    input, select, textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #2a4a6a;
        border-radius: 6px;
        background: #1a2f4a;
        color: #e0e0e0;
        font-size: 14px;
    }
    input:focus, select:focus, textarea:focus {
        outline: none;
        border-color: #007bff;
        box-shadow: 0 0 15px rgba(0, 123, 255, 0.4);
    }
    table {
        width: 100%;
        border-collapse: collapse;
        background: #1a2f4a;
        border-radius: 6px;
        overflow: hidden;
    }
    th {
        background: #0f1f38;
        padding: 12px;
        text-align: left;
        font-size: 11px;
        color: #007bff;
        text-transform: uppercase;
        border-bottom: 1px solid #2a4a6a;
    }
    td {
        padding: 10px 12px;
        border-bottom: 1px solid #2a4a6a;
        font-size: 13px;
        color: #e0e0e0;
    }
    tr:hover {
        background: #1f3a5a;
    }
   .cart-item-name {
        color: #fff;
        font-weight: 600;
    }
   .total-line {
        color: #e0e0e0;
    }
</style>
</head>
<body>
    <div class="navbar">
        <div class="navbar-left">
            <h1>SISTEMA JAGUAR</h1>
            <div class="user-info" id="userInfo">
                <img id="userPic" class="user-pic" src="" alt="">
                <div>
                    <div class="user-name" id="userName"></div>
                    <span class="badge">DISTRIBUIDOR</span>
                </div>
            </div>
        </div>
        <div>
            <button class="btn" onclick="goToDashboard()">DASHBOARD</button>
        </div>
    </div>
    
    <div class="container">
        <div class="menu-grid">
            <div class="menu-card" onclick="goTo('movimientos')">
                <h2>MOVIMIENTOS</h2>
                <p>Alta de proveedores y productos.<br>Gestión de inventario.<br>Entradas y salidas de stock.</p>
            </div>
            <div class="menu-card" onclick="goTo('cotizacion')">
                <h2>COTIZACIÓN</h2>
                <p>Seleccionar cliente.<br>Buscar productos Jaguar.<br>Generar cotizaciones.</p>
            </div>
            <div class="menu-card" onclick="goTo('clientes')">
                <h2>CLIENTES</h2>
                <p>Alta de clientes.<br>Datos fiscales RFC.<br>CRUD completo.</p>
            </div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const currentUser = urlParams.get('user') || localStorage.getItem('username');
        
        if (!currentUser || currentUser !== 'Cris') {
            alert('Acceso denegado');
            window.location.href = '/dashboard.html';
        }
        
        async function loadUserInfo() {
            const res = await fetch(`/api/user/${currentUser}`);
            const user = await res.json();
            document.getElementById('userName').textContent = user.username;
            document.getElementById('userPic').src = user.profile_pic || '/uploads/LogoMetal.png';
        }
        
        function goTo(modulo) {
            window.location.href = `/jaguar-${modulo}.html?user=${currentUser}`;
        }
        
        function goToDashboard() {
            window.location.href = `/dashboard.html?user=${currentUser}`;
        }
        
        loadUserInfo();
    </script>
</body>
</html>
