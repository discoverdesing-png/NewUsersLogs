<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin</title>
    <style>
        /* Usa el mismo style que me pasaste del dashboard */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #000; 
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }
       .navbar {
            background: #0f0f0f;
            padding: 20px 40px;
            border-radius: 12px;
            border: 1px solid #1a1a1a;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
       .navbar h1 {
            color: #ff0000;
            font-size: 26px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            letter-spacing: 3px;
            font-weight: 800;
        }
       .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: #0f0f0f; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.15), 0 8px 32px rgba(0,0,0,0.9);
            border: 1px solid #1a1a1a;
        }
       .search-box {
            width: 100%;
            padding: 16px;
            margin-bottom: 20px;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            background: #1a1a1a;
            color: #e0e0e0;
            font-size: 15px;
        }
       .user-list {
            display: grid;
            gap: 15px;
        }
       .user-card {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
       .user-card:hover {
            border-color: #ff0000;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
            transform: translateY(-3px);
            background: #1f1f1f;
        }
       .btn { 
            padding: 15px 30px; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            background: #0a0a0a;
            color: #fff;
            border: 2px solid transparent;
            overflow: hidden;
            z-index: 1;
        }
       .btn::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: conic-gradient(from 0deg, transparent 0deg, #ff0000 60deg, #ff4d4d 120deg, #ff0000 180deg, transparent 360deg);
            border-radius: 8px;
            z-index: -1;
            animation: borderRotate 3s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }
       .btn::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: #0a0a0a;
            border-radius: 6px;
            z-index: -1;
        }
       .btn:hover::before { opacity: 1; }
       .btn:hover::after { background: #1a0000; }
       .btn:hover { color: #ff4d4d; }
        
        @keyframes borderRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <h1>PANEL ADMIN</h1>
        <button class="btn" onclick="window.location.href='/dashboard.html?user='+localStorage.getItem('username')">MI PERFIL</button>
    </div>
    
    <div class="container">
        <input type="text" id="searchInput" class="search-box" placeholder="Buscar por usuario, nombre, apellido o email...">
        <div class="user-list" id="userList"></div>
    </div>

    <script>
        const searchInput = document.getElementById('searchInput');
        const userList = document.getElementById('userList');
        
        async function loadUsers(search = '') {
            const res = await fetch(`/api/admin/users?search=${search}`);
            const users = await res.json();
            
            userList.innerHTML = users.map(u => `
                <div class="user-card" onclick="editUser(${u.id})">
                    <div>
                        <strong style="color:#ff0000">${u.username}</strong><br>
                        ${u.name} ${u.last_name} - ${u.email}
                    </div>
                    <span>EDITAR →</span>
                </div>
            `).join('');
        }
        
        function editUser(id) {
            window.location.href = `/EditarUser1.html?id=${id}`;
        }
        
        searchInput.addEventListener('input', (e) => {
            loadUsers(e.target.value);
        });
        
        loadUsers();
    </script>
</body>
</html>
