<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #000; 
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }
  .navbar {
            background: #0f0f0f;
            padding: 20px 40px;
            border-radius: 12px;
            border: 1px solid #1a1a1a;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
  .navbar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
  .navbar h1 {
            color: #ff0000;
            font-size: 26px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            letter-spacing: 3px;
            font-weight: 800;
        }
  .admin-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
  .admin-pic {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #ff0000;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }
  .admin-name {
            color: #fff;
            font-size: 16px;
            font-weight: 700;
        }
  .admin-badge {
            background: #ff0000;
            color: #000;
            padding: 4px 10px;
            border-radius: 5px;
            font-size: 10px;
            font-weight: 800;
            letter-spacing: 1px;
       }
  .navbar-right {
            display: flex;
            gap: 15px;
       }
  .container { 
            max-width: 1000px; 
            margin: 0 auto; 
            background: #0f0f0f; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.15), 0 8px 32px rgba(0,0,0,0.9);
            border: 1px solid #1a1a1a;
        }
  .search-box {
            width: 100%;
            padding: 16px;
            margin-bottom: 25px;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            background: #1a1a1a;
            color: #e0e0e0;
            font-size: 15px;
        }
  .search-box:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            background: #222;
        }
  .user-list {
            display: grid;
            gap: 15px;
        }
  .user-card {
            background: #1a1a1a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
  .user-card:hover {
            border-color: #ff0000;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
            transform: translateY(-3px);
            background: #1f1f1f;
        }
  .user-info strong {
            color: #ff0000;
            font-size: 18px;
       }
  .user-info span {
            color: #999;
            font-size: 14px;
       }
  .user-badge {
            background: #ff0000;
            color: #000;
            padding: 5px 12px;
            border-radius: 5px;
            font-size: 11px;
            font-weight: 800;
            letter-spacing: 1px;
       }
        
        /* BOTÓN ROJO CON LUZ QUE RECORRE EL MARCO */
  .btn { 
            padding: 15px 30px; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            background: #0a0a0a;
            color: #fff;
            border: 2px solid transparent;
            overflow: hidden;
            z-index: 1;
        }
  .btn::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: conic-gradient(from 0deg, transparent 0deg, #ff0000 60deg, #ff4d4d 120deg, #ff0000 180deg, transparent 360deg);
            border-radius: 8px;
            z-index: -1;
            animation: borderRotate 3s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }
  .btn::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: #0a0a0a;
            border-radius: 6px;
            z-index: -1;
            transition: background 0.3s ease;
        }
  .btn:hover::before { opacity: 1; }
  .btn:hover::after { background: #1a0000; }
  .btn:hover {
            transform: translateY(-3px);
            color: #ff4d4d;
        }
        
        @keyframes borderRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="navbar-left">
            <h1>PANEL ADMIN</h1>
            <div class="admin-info" id="adminInfo">
                <img id="adminPic" class="admin-pic" src="" alt="">
                <div>
                    <div class="admin-name" id="adminName"></div>
                    <span class="admin-badge">ADMIN</span>
                </div>
            </div>
        </div>
        <div class="navbar-right">
            <button class="btn" onclick="goToDashboard()">MI DASHBOARD</button>
            <button class="btn" onclick="logout()">CERRAR SESIÓN</button>
        </div>
    </div>
    
    <div class="container">
        <input type="text" id="searchInput" class="search-box" placeholder="Buscar por usuario, nombre, apellido o email...">
        <div class="user-list" id="userList"></div>
    </div>
