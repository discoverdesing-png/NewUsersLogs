<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Crear Cuenta</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #000; 
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }
   .container { 
            max-width: 800px; 
            margin: 0 auto; 
            background: #0f0f0f; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.15), 0 8px 32px rgba(0,0,0,0.9);
            border: 1px solid #1a1a1a;
        }
   .title {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 35px;
            color: #ff0000;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            letter-spacing: 3px;
        }
   .alert-msg {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid #ff0000;
            color: #ff4d4d;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            display: none;
        }
   .alert-msg.show { display: block; }
   .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
   .input-group {
            margin-bottom: 18px;
        }
   .input-group.full-width {
            grid-column: 1 / -1;
        }
   .input-field { 
            width: 100%; 
            padding: 16px; 
            border: 1px solid #2a2a2a; 
            border-radius: 8px; 
            background: #1a1a1a;
            color: #e0e0e0;
            font-size: 15px;
        }
   .input-field:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            background: #222;
        }
   label {
            display: block;
            color: #ff0000;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 8px;
            font-weight: 700;
        }
   .btn-group {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
            margin-top: 30px;
       }
        
   .btn { 
            padding: 20px; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            background: #0a0a0a;
            color: #fff;
            border: 2px solid transparent;
            overflow: hidden;
            z-index: 1;
        }
   .btn::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: conic-gradient(from 0deg, transparent 0deg, #ff0000 60deg, #ff4d4d 120deg, #ff0000 180deg, transparent 360deg);
            border-radius: 8px;
            z-index: -1;
            animation: borderRotate 3s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }
   .btn::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: #0a0a0a;
            border-radius: 6px;
            z-index: -1;
            transition: background 0.3s ease;
        }
   .btn:hover::before { opacity: 1; }
   .btn:hover::after { background: #1a0000; }
   .btn:hover {
            transform: translateY(-3px);
            color: #ff4d4d;
        }
        
        @keyframes borderRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <h2 class="title">CREAR PERSONAJE</h2>
        <div class="alert-msg" id="alertMsg"></div>
        
        <form id="registerForm">
            <div class="form-grid">
                <div class="input-group">
                    <label>Usuario</label>
                    <input type="text" name="username" class="input-field" required>
                </div>
                
                <div class="input-group">
                    <label>Contraseña</label>
                    <input type="password" name="password" class="input-field" required>
                </div>
                
                <div class="input-group">
                    <label>Nombre</label>
                    <input type="text" name="name" class="input-field" required>
                </div>
                
                <div class="input-group">
                    <label>Apellido</label>
                    <input type="text" name="last_name" class="input-field" required>
                </div>
                
                <div class="input-group">
                    <label>Fecha de Nacimiento</label>
                    <input type="date" name="birth_date" class="input-field">
                </div>
                
                <div class="input-group">
                    <label>Género</label>
                    <select name="gender" class="input-field">
                        <option value="">Seleccionar</option>
                        <option value="M">Masculino</option>
                        <option value="F">Femenino</option>
                        <option value="O">Otro</option>
                    </select>
                </div>
                
                <div class="input-group">
                    <label>Teléfono</label>
                    <input type="tel" name="phone" class="input-field">
                </div>
                
                <div class="input-group">
                    <label>Email</label>
                    <input type="email" name="email" class="input-field" required>
                </div>
                
                <div class="input-group full-width">
                    <label>Dirección</label>
                    <input type="text" name="address" class="input-field">
                </div>
                
                <div class="input-group">
                    <label>Ciudad</label>
                    <input type="text" name="city" class="input-field">
                </div>
                
                <div class="input-group">
                    <label>País</label>
                    <input type="text" name="country" class="input-field">
                </div>
                
                <div class="input-group full-width">
                    <label>Foto de Perfil</label>
                    <input type="file" name="profile_pic" class="input-field" accept="image/*">
                </div>
            </div>
            
            <div class="btn-group">
                <button type="submit" class="btn" id="submitBtn">CREAR PERSONAJE</button>
                <button type="button" class="btn" onclick="window.location.href='/index.html'">CANCELAR</button>
            </div>
        </form>
    </div>

    <script>
        const form = document.getElementById('registerForm');
        const alertMsg = document.getElementById('alertMsg');
        const submitBtn = document.getElementById('submitBtn');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            alertMsg.classList.remove('show');
            submitBtn.disabled = true;
            submitBtn.textContent = 'CREANDO...';
            
            const formData = new FormData(form);

            try {
                const res = await fetch('/register', {
                    method: 'POST',
                    body: formData
                });

                const result = await res.json();
                
                if (result.success) {
                    showAlert(`Personaje ${result.username} creado correctamente. Redirigiendo al login...`);
                    setTimeout(() => {
                        window.location.href = '/index.html';
                    }, 3000);
                } else {
                    showAlert(result.message);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'CREAR PERSONAJE';
                }
            } catch (error) {
                showAlert('Error de conexión con el servidor');
                submitBtn.disabled = false;
                submitBtn.textContent = 'CREAR PERSONAJE';
            }
        });
        
        function showAlert(message) {
            alertMsg.textContent = message;
            alertMsg.classList.add('show');
            setTimeout(() => {
                alertMsg.classList.remove('show');
            }, 3000);
        }
    </script>
</body>
</html>
