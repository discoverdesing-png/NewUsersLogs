<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Registro</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #000000; 
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }
 .container { 
            max-width: 520px; 
            margin: 20px auto; 
            background: #0f0f0f; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 0 50px rgba(255, 0, 0, 0.2), 0 8px 32px rgba(0,0,0,0.8);
            border: 1px solid #1a1a1a;
        }
        
 .logo-upload {
            width: 150px;
            height: 150px;
            border: 2px dashed #ff0000;
            border-radius: 12px;
            margin: 0 auto 25px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            transition: all 0.3s ease;
            overflow: hidden;
            background-color: #1a1a1a;
            position: relative;
        }
 .logo-upload:hover { 
            border-color: #ff4d4d; 
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.7);
            transform: scale(1.05);
        }
 .logo-upload.has-image { 
            border: 2px solid #ff4d4d;
            box-shadow: 0 0 25px rgba(255, 77, 77, 0.5);
        }
 .logo-content { text-align: center; color: #ff0000; pointer-events: none; }
 .logo-text { display: block; font-size: 14px; margin-bottom: 6px; letter-spacing: 2px; font-weight: 700; }
 .plus-icon { display: block; font-size: 36px; font-weight: 300; line-height: 1; }

 .form-row { display: flex; gap: 12px; margin-bottom: 14px; }
 .form-row input, select { 
            flex: 1; 
            padding: 14px; 
            border: 1px solid #2a2a2a; 
            border-radius: 8px;
            background: #1a1a1a;
            color: #e0e0e0;
            font-size: 14px;
            transition: all 0.2s;
        }
 .form-row input:focus, select:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            background: #222;
     }
 .full-width { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 14px; 
            border: 1px solid #2a2a2a; 
            border-radius: 8px; 
            background: #1a1a1a;
            color: #e0e0e0;
            font-size: 14px;
            transition: all 0.2s;
        }
 .full-width:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.4);
            background: #222;
     }
        
        /* BOTONES CON LUZ QUE RECORRE EL MARCO */
 .btn { 
            width: 100%; 
            padding: 30px; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            background: #0a0a0a;
            color: #fff;
            border: 2px solid transparent;
            margin-bottom: 12px;
            overflow: hidden;
            z-index: 1;
        }
        
        /* LA LUZ ROJA QUE RECORRE EL MARCO */
 .btn::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: conic-gradient(from 0deg, transparent 0deg, #ff0000 60deg, #ff4d4d 120deg, #ff0000 180deg, transparent 360deg);
            border-radius: 8px;
            z-index: -1;
            animation: borderRotate 3s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }
 .btn::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: #0a0a0a;
            border-radius: 6px;
            z-index: -1;
            transition: background 0.3s ease;
        }
 .btn:hover::before { opacity: 1; }
 .btn:hover::after { background: #1a0000; } /* Negro que apenas cambia a rojo */
 .btn:hover {
            transform: translateY(-3px);
            color: #ff4d4d;
        }
        
        @keyframes borderRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        label { font-size: 12px; color: #999; display: block; margin-bottom: 5px; font-weight: 500; }
        input::placeholder { color: #555; }
        option { background: #1a1a1a; color: #e0e0e0; }
        input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(1); }
    </style>
</head>
<body>
    <div class="container">
        <form action="/register" method="POST" enctype="multipart/form-data">
            
            <input type="file" id="profile_pic" name="profile_pic" accept="image/*" hidden required>
            <label for="profile_pic" class="logo-upload" id="logoUpload">
                <div class="logo-content" id="logoContent">
                    <span class="logo-text">LOGO AQUÍ</span>
                    <span class="plus-icon">+</span>
                </div>
            </label>

            <div class="form-row">
                <input type="text" name="username" placeholder="User" required>
                <input type="password" name="password" placeholder="Password" required>
            </div>
            <div class="form-row">
                <input type="text" name="name" placeholder="Name" required>
                <input type="text" name="last_name" placeholder="Last Name" required>
            </div>
            <div class="form-row">
                <div style="flex:1">
                    <label>Birth date DD/MM/AAAA</label>
                    <input type="date" name="birth_date" required>
                </div>
                <div style="flex:1">
                    <label>Gender</label>
                    <select name="gender" required>
                        <option value="">Seleccionar</option>
                        <option value="Masculino">Masculino</option>
                        <option value="Femenino">Femenino</option>
                        <option value="Otro">Otro</option>
                    </select>
                </div>
            </div>
            <input type="tel" name="phone" placeholder="Phone Opcional" class="full-width">
            <input type="email" name="email" placeholder="Email" class="full-width" required>
            <input type="text" name="address" placeholder="Address" class="full-width" required>
            <div class="form-row">
                <input type="text" name="city" placeholder="City" required>
                <input type="text" name="country" placeholder="Country" required>
            </div>
            <button type="submit" class="btn">Crear Cuenta</button>
        </form>
        
        <button type="button" class="btn" onclick="window.location.href='/index.html'">
            ¿Ya tienes cuenta? Log In
        </button>
    </div>

    <script>
        const inputFile = document.getElementById('profile_pic');
        const logoUpload = document.getElementById('logoUpload');
        const logoContent = document.getElementById('logoContent');

        inputFile.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    logoUpload.style.backgroundImage = `url('${event.target.result}')`;
                    logoUpload.classList.add('has-image');
                    logoContent.style.display = 'none'; // MATA EL TEXTO SÍ O SÍ
                }
                reader.readAsDataURL(file);
            }
        });
    </script>
</body>
</html>
