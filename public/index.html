<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Log In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #000; 
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
       .container { 
            max-width: 420px; 
            width: 100%;
            background: #0f0f0f; 
            padding: 50px 40px; 
            border-radius: 12px; 
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.2), 0 8px 32px rgba(0,0,0,0.9);
            border: 1px solid #1a1a1a;
        }
       .logo-img {
            width: 130px;
            height: 130px;
            margin: 0 auto 30px;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 0 25px rgba(255, 0, 0, 0.8));
        }
       .title {
            text-align: center;
            font-size: 30px;
            font-weight: 800;
            margin-bottom: 35px;
            color: #ff0000;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            letter-spacing: 3px;
        }
       .input-field { 
            width: 100%; 
            padding: 16px; 
            margin-bottom: 18px; 
            border: 1px solid #2a2a2a; 
            border-radius: 8px; 
            background: #1a1a1a;
            color: #e0e0e0;
            font-size: 15px;
            transition: all 0.3s ease;
        }
       .input-field:focus {
            outline: none;
            border-color: #ff0000;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.5);
            background: #222;
        }
       .error-msg {
            background: rgba(255, 0, 0, 0.15);
            border: 1px solid #ff0000;
            color: #ff4d4d;
            padding: 14px;
            border-radius: 8px;
            margin-bottom: 18px;
            text-align: center;
            font-size: 14px;
            font-weight: 600;
            display: none;
            animation: slideDown 0.3s ease;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.3);
        }
       .error-msg.show { display: block; }
       .error-msg.success {
            background: rgba(0, 255, 0, 0.15);
            border-color: #00ff00;
            color: #4dff4d;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
       .btn { 
            width: 100%; 
            padding: 30px; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            background: #0a0a0a;
            color: #fff;
            border: 2px solid transparent;
            margin-bottom: 14px;
            overflow: hidden;
            z-index: 1;
        }
       .btn::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: conic-gradient(from 0deg, transparent 0deg, #ff0000 60deg, #ff4d4d 120deg, #ff0000 180deg, transparent 360deg);
            border-radius: 8px;
            z-index: -1;
            animation: borderRotate 3s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }
       .btn::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: #0a0a0a;
            border-radius: 6px;
            z-index: -1;
            transition: background 0.3s ease;
        }
       .btn:hover::before { opacity: 1; }
       .btn:hover::after { background: #1a0000; }
       .btn:hover {
            transform: translateY(-3px);
            color: #ff4d4d;
        }
        @keyframes borderRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        input::placeholder { color: #555; }
    </style>
</head>
<body>
    <div class="container">
        <img src="/uploads/LogoMetal.png" alt="Logo" class="logo-img">
        <h1 class="title">INICIAR SESIÓN</h1>
        <div class="error-msg" id="errorMsg"></div>
        <form id="loginForm">
            <input type="text" name="username" placeholder="Usuario" class="input-field" required>
            <input type="password" name="password" placeholder="Contraseña" class="input-field" required>
            <button type="submit" class="btn">Entrar</button>
        </form>
        <button type="button" class="btn" onclick="window.location.href='/registro.html'">
            Crear Cuenta Nueva
        </button>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const errorMsg = document.getElementById('errorMsg');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(form);
            const data = Object.fromEntries(formData);

            const res = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            const result = await res.json();
            
            if (result.success) {
                errorMsg.textContent = 'Login exitoso';
                errorMsg.classList.add('show', 'success');
                setTimeout(() => {
                    window.location.href = `/dashboard.html?user=${result.username}`;
                }, 1000);
            } else {
                errorMsg.textContent = result.message;
                errorMsg.classList.remove('success');
                errorMsg.classList.add('show');
                setTimeout(() => {
                    errorMsg.classList.remove('show');
                }, 3000);
            }
        });
    </script>
</body>
</html>
