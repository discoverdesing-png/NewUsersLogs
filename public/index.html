<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Log In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #0a0a0a; 
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
   .container { 
            max-width: 400px; 
            width: 100%;
            background: #151515; 
            padding: 50px 40px; 
            border-radius: 16px; 
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.2), 0 8px 32px rgba(0,0,0,0.5);
            border: 1px solid #2a2a2a;
        }
        
        /* TU LOGO */
   .logo-img {
            width: 120px;
            height: 120px;
            margin: 0 auto 30px;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 0 15px rgba(255, 26, 26, 0.5));
            animation: pulse 2s infinite;
        }
        @keyframes pulse {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(255, 26, 26, 0.5)); }
            50% { filter: drop-shadow(0 0 25px rgba(255, 26, 26, 0.8)); }
        }
        
   .title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #ff1a1a;
            text-shadow: 0 0 15px rgba(255, 26, 26, 0.5);
            letter-spacing: 2px;
    }

   .full-width { 
            width: 100%; 
            padding: 14px; 
            margin-bottom: 16px; 
            border: 1px solid #333; 
            border-radius: 8px; 
            box-sizing: border-box;
            background: #1f1f1f;
            color: #e0e0e0;
            font-size: 15px;
            transition: all 0.2s;
        }
   .full-width:focus {
            outline: none;
            border-color: #ff1a1a;
            box-shadow: 0 0 12px rgba(255, 26, 26, 0.4);
            background: #252525;
     }
    
   .btn-submit { 
            width: 100%; 
            padding: 15px; 
            background: linear-gradient(135deg, #ff1a1a, #cc0000); 
            color: white; 
            border: none; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
   .btn-submit:hover {
            background: linear-gradient(135deg, #ff4d4d, #ff1a1a);
            box-shadow: 0 0 25px rgba(255, 26, 26, 0.7);
            transform: translateY(-2px);
     }
   .btn-submit:active { transform: translateY(0px); }
    
   .btn-register { 
            width: 100%; 
            padding: 15px; 
            background: transparent; 
            color: #ff1a1a; 
            border: 2px solid #ff1a1a; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
   .btn-register:hover {
            background: rgba(255, 26, 26, 0.15);
            box-shadow: 0 0 25px rgba(255, 26, 26, 0.5);
            transform: translateY(-2px);
     }
   .btn-register:active { transform: translateY(0px); }
        
        input::placeholder { color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <!-- TU LOGO DESDE /uploads/LogoMetal.png -->
        <img src="/uploads/LogoMetal.png" alt="Logo" class="logo-img">
        
        <h1 class="title">INICIAR SESIÓN</h1>
        
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Usuario" class="full-width" required>
            <input type="password" name="password" placeholder="Contraseña" class="full-width" required>
            <button type="submit" class="btn-submit">Entrar</button>
        </form>
        
        <button type="button" class="btn-register" onclick="window.location.href='/registro.html'">
            Crear Cuenta Nueva
        </button>
    </div>
</body>
</html>
