<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Log In</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #0a0a0a; 
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
            display: flex;
            align-items: center;
            justify-content: center;
        }
    .container { 
            max-width: 400px; 
            width: 100%;
            background: #151515; 
            padding: 50px 40px; 
            border-radius: 12px; 
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.25), 0 8px 32px rgba(0,0,0,0.6);
            border: 1px solid #2a2a2a;
        }
        
        /* TU LOGO */
    .logo-img {
            width: 240px;
            height: 240px;
            margin: 0 auto 30px;
            display: block;
            object-fit: contain;
            filter: drop-shadow(0 0 20px rgba(255, 26, 26, 0.6));
            animation: pulse 2.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { filter: drop-shadow(0 0 15px rgba(255, 26, 26, 0.5)); }
            50% { filter: drop-shadow(0 0 30px rgba(255, 26, 26, 0.9)); }
        }
        
    .title {
            text-align: center;
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #ff1a1a;
            text-shadow: 0 0 15px rgba(255, 26, 26, 0.6);
            letter-spacing: 2px;
        }

    .full-width { 
            width: 100%; 
            padding: 15px; 
            margin-bottom: 16px; 
            border: 1px solid #333; 
            border-radius: 8px; 
            background: #1f1f1f;
            color: #e0e0e0;
            font-size: 15px;
            transition: all 0.2s;
        }
    .full-width:focus {
            outline: none;
            border-color: #ff1a1a;
            box-shadow: 0 0 15px rgba(255, 26, 26, 0.5);
            background: #252525;
        }
        
        /* BOTONES CON LUZ QUE RECORRE EL MARCO */
    .btn { 
            width: 100%; 
            padding: 16px 30px; 
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            overflow: hidden;
            background: #1a1a1a;
            margin-bottom: 12px;
        }
        
        /* EFECTO DE LUZ RECORRIENDO EL MARCO */
    .btn::before {
            content: '';
            position: absolute;
            top: -2px;
            left: -2px;
            right: -2px;
            bottom: -2px;
            background: linear-gradient(90deg, transparent, #ff1a1a, transparent);
            border-radius: 8px;
            opacity: 0;
            transition: opacity 0.3s;
            animation: borderRun 2s linear infinite;
            z-index: -1;
        }
    .btn:hover::before { opacity: 1; }
        
        @keyframes borderRun {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(100%); }
        }

    .btn-submit { 
            color: white; 
            border: 2px solid #ff1a1a;
        }
    .btn-submit:hover {
            background: rgba(255, 26, 26, 0.2);
            transform: translateY(-2px);
        }
    
    .btn-register { 
            color: #ff1a1a; 
            border: 2px solid #ff1a1a;
        }
    .btn-register:hover {
            background: rgba(255, 26, 26, 0.15);
            transform: translateY(-2px);
        }
        
        input::placeholder { color: #666; }
    </style>
</head>
<body>
    <div class="container">
        <!-- CHECA QUE LogoMetal.png ESTÉ EN public/uploads/ -->
        <img src="/uploads/LogoMetal.png" alt="Logo" class="logo-img">
        
        <h1 class="title">INICIAR SESIÓN</h1>
        
        <form action="/login" method="POST">
            <input type="text" name="username" placeholder="Usuario" class="full-width" required>
            <input type="password" name="password" placeholder="Contraseña" class="full-width" required>
            <button type="submit" class="btn btn-submit">Entrar</button>
        </form>
        
        <button type="button" class="btn btn-register" onclick="window.location.href='/registro.html'">
            Crear Cuenta Nueva
        </button>
    </div>
</body>
</html>
