<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #000; 
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }
.navbar {
            background: #0f0f0f;
            padding: 20px 40px;
            border-radius: 12px;
            border: 1px solid #1a1a1a;
            box-shadow: 0 0 40px rgba(255, 0, 0, 0.2);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
.navbar-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }
.navbar h1 {
            color: #ff0000;
            font-size: 26px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            letter-spacing: 3px;
            font-weight: 800;
        }
.user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
.user-pic {
            width: 45px;
            height: 45px;
            border-radius: 50%;
            border: 2px solid #ff0000;
            object-fit: cover;
            box-shadow: 0 0 15px rgba(255, 0, 0, 0.6);
        }
.user-name {
            color: #fff;
            font-size: 16px;
            font-weight: 700;
        }
.navbar-right {
            display: flex;
            gap: 15px;
       }
.container { 
            max-width: 1200px; 
            margin: 0 auto; 
            background: #0f0f0f; 
            padding: 40px; 
            border-radius: 12px; 
            box-shadow: 0 0 60px rgba(255, 0, 0, 0.15), 0 8px 32px rgba(0,0,0,0.9);
            border: 1px solid #1a1a1a;
        }
.welcome {
            text-align: center;
            margin-bottom: 40px;
        }
.welcome h2 {
            color: #ff0000;
            font-size: 32px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.8);
            margin-bottom: 10px;
        }
.welcome p {
            color: #999;
            font-size: 16px;
        }
.card-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 25px;
            margin-top: 30px;
        }
.card {
            background: #1a1a1a;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #2a2a2a;
            transition: all 0.3s ease;
            text-align: center;
        }
.card:hover {
            border-color: #ff0000;
            box-shadow: 0 0 25px rgba(255, 0, 0, 0.4);
            transform: translateY(-3px);
        }
.card h3 {
            color: #ff0000;
            font-size: 20px;
            margin-bottom: 10px;
        }
.card p {
            color: #999;
            font-size: 14px;
        }
        
.btn { 
            padding: 15px 30px; 
            border-radius: 8px; 
            font-weight: 700; 
            font-size: 14px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            position: relative;
            background: #0a0a0a;
            color: #fff;
            border: 2px solid transparent;
            overflow: hidden;
            z-index: 1;
        }
.btn::before {
            content: '';
            position: absolute;
            inset: -2px;
            background: conic-gradient(from 0deg, transparent 0deg, #ff0000 60deg, #ff4d4d 120deg, #ff0000 180deg, transparent 360deg);
            border-radius: 8px;
            z-index: -1;
            animation: borderRotate 3s linear infinite;
            opacity: 0;
            transition: opacity 0.3s;
        }
.btn::after {
            content: '';
            position: absolute;
            inset: 2px;
            background: #0a0a0a;
            border-radius: 6px;
            z-index: -1;
            transition: background 0.3s ease;
        }
.btn:hover::before { opacity: 1; }
.btn:hover::after { background: #1a0000; }
.btn:hover {
            transform: translateY(-3px);
            color: #ff4d4d;
        }
        
        @keyframes borderRotate {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="navbar">
        <div class="navbar-left">
            <h1>DASHBOARD</h1>
            <div class="user-info" id="userInfo">
                <img id="userPic" class="user-pic" src="" alt="">
                <div class="user-name" id="userName"></div>
            </div>
        </div>
        <div class="navbar-right">
            <button class="btn" onclick="logout()">CERRAR SESIÓN</button>
        </div>
    </div>
    
    <div class="container">
        <div class="welcome">
            <h2>Bienvenido</h2>
            <p>Selecciona un sistema para comenzar</p>
        </div>
        
        <div class="card-grid">
            <div class="card">
                <h3>Sistema 1</h3>
                <p>Descripción del sistema</p>
            </div>
            <div class="card">
                <h3>Sistema 2</h3>
                <p>Descripción del sistema</p>
            </div>
            <div class="card">
                <h3>Sistema 3</h3>
                <p>Descripción del sistema</p>
            </div>
        </div>
    </div>

<script>
    const currentUser = new URLSearchParams(window.location.search).get('user') || localStorage.getItem('username');
    
    if (!currentUser) {
        window.location.href = '/index.html';
    }
    
    localStorage.setItem('username', currentUser);
    
    async function loadUserInfo() {
        const res = await fetch(`/api/user/${currentUser}?user=${currentUser}`);
        const user = await res.json();
        document.getElementById('userName').textContent = user.username;
        document.getElementById('userPic').src = user.profile_pic || '/uploads/LogoMetal.png';
        
        // Botón de Pastelería solo si es Reyna_34142
        if (currentUser === 'Reyna_34142') {
            const navbarRight = document.querySelector('.navbar-right');
            const btnPasteleria = document.createElement('button');
            btnPasteleria.className = 'btn';
            btnPasteleria.textContent = 'PASTELERÍA REYNA';
            btnPasteleria.onclick = () => window.location.href = `/PasteleriaReyna?user=${currentUser}`;
            navbarRight.insertBefore(btnPasteleria, navbarRight.firstChild);
        }
        
        // Botón Sistema Jaguar solo si es Cris
        if (currentUser === 'Cris') {
            const navbarRight = document.querySelector('.navbar-right');
            const btnJaguar = document.createElement('button');
            btnJaguar.className = 'btn';
            btnJaguar.textContent = 'SISTEMA JAGUAR';
            btnJaguar.onclick = () => window.location.href = `/jaguar.html?user=${currentUser}`;
            navbarRight.insertBefore(btnJaguar, navbarRight.firstChild);
        }
    }
    
    function logout() {
        localStorage.clear();
        window.location.href = '/index.html';
    }
    
    loadUserInfo();
</script>
</body>
</html>
