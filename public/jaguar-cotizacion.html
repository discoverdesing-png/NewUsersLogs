<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Cotización - Sistema Jaguar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Arial, sans-serif; 
            background: #0a1628; 
            min-height: 100vh;
            padding: 20px;
            color: #e0e0e0;
        }
        .navbar {
            background: #0f1f38;
            padding: 20px 40px;
            border-radius: 12px;
            border: 1px solid #1a2f4a;
            box-shadow: 0 0 40px rgba(0, 123, 255, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }
        .navbar h1 {
            color: #007bff;
            font-size: 24px;
            text-shadow: 0 0 20px rgba(0, 123, 255, 0.8);
            letter-spacing: 2px;
            font-weight: 800;
        }
        .container { 
            max-width: 1400px; 
            margin: 0 auto; 
            display: grid;
            grid-template-columns: 1fr 1fr 400px;
            gap: 20px;
        }
        .card { 
            background: #0f1f38; 
            padding: 25px; 
            border-radius: 12px; 
            box-shadow: 0 0 60px rgba(0, 123, 255, 0.2);
            border: 1px solid #1a2f4a;
        }
        .card h2 {
            color: #007bff;
            font-size: 16px;
            margin-bottom: 15px;
            text-transform: uppercase;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            color: #a0c4e8;
            font-size: 12px;
            margin-bottom: 5px;
            font-weight: 600;
        }
        input, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #2a4a6a;
            border-radius: 6px;
            background: #1a2f4a;
            color: #e0e0e0;
            font-size: 14px;
        }
        input:focus, select:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 15px rgba(0, 123, 255, 0.4);
        }
        .btn { 
            padding: 10px 20px; 
            border-radius: 6px; 
            font-weight: 700; 
            font-size: 12px;
            cursor: pointer;
            text-transform: uppercase;
            background: #0a1628;
            color: #fff;
            border: 2px solid #007bff;
            transition: all 0.3s;
            width: 100%;
        }
        .btn:hover {
            background: #007bff;
            box-shadow: 0 0 20px rgba(0, 123, 255, 0.8);
        }
        .btn-success {
            border-color: #28a745;
            color: #28a745;
        }
        .btn-success:hover {
            background: #28a745;
            color: #fff;
        }
        .list {
            max-height: 500px;
            overflow-y: auto;
        }
        .product-item {
            background: #1a2f4a;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            border: 1px solid #2a4a6a;
            cursor: pointer;
            transition: all 0.2s;
        }
        .product-item:hover {
            border-color: #007bff;
            background: #1f3a5a;
        }
